name: CD — Deploy (Railway + Vercel)

# Se déclenche uniquement après que le CI soit passé sur master
on:
  workflow_run:
    workflows: ["CI — Tests & Build"]
    types: [completed]
    branches: [master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Condition : on déploie seulement si le CI a réussi
  # ─────────────────────────────────────────────────────────────────
  guard:
    name: CI réussi ?
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.result.outputs.ok }}
    steps:
      - id: result
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "ok=true"  >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "⛔ CI échoué — déploiement annulé."
          fi

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Backend → Railway
  # Railway détecte automatiquement NestJS et déploie depuis le sous-dossier.
  # Nécessite : secret RAILWAY_TOKEN
  # ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest

    environment:
      name: production-backend
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        working-directory: backend-projet/library-management
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Déploie le service backend sur Railway
          # Railway utilise le Dockerfile existant dans ce dossier
          railway up --service backend --detach
          echo "✅ Backend déployé sur Railway"

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Frontend → Vercel
  # Nécessite : secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # ─────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest

    environment:
      name: production-frontend
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-projet/frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend-projet/frontend
        run: npm ci

      - name: Build Vite (prod)
        working-directory: frontend-projet/frontend
        run: npm run build
        env:
          # URL du backend Railway — à renseigner dans les Variables GitHub
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        working-directory: frontend-projet/frontend
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # --prod = déploiement en production (pas preview)
          URL=$(vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --local-config vercel.json 2>/dev/null || \
            vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Frontend déployé : $URL"

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 — Résumé du déploiement
  # ─────────────────────────────────────────────────────────────────
  deploy-summary:
    name: Résumé déploiement
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Résultat
        run: |
          echo "Backend  Railway : ${{ needs.deploy-backend.result }}"
          echo "Frontend Vercel  : ${{ needs.deploy-frontend.result }}"
