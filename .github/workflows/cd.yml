name: CD — Docker Build & Deploy

on:
  # Se déclenche uniquement après que le CI soit passé sur master
  workflow_run:
    workflows: ["CI — Tests & Build"]
    types: [completed]
    branches: [master]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Condition : on déploie seulement si le CI a réussi
  # ─────────────────────────────────────────────────────────────────
  check:
    name: Vérifier le CI
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Build & push images Docker sur GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────
  docker:
    name: Docker — Build & Push GHCR
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # nécessaire pour push sur ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Image Backend ──
      - name: Build & push — backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend-projet/library-management
          push: true
          # Tag : latest + sha court pour le rollback
          tags: |
            ghcr.io/${{ github.repository_owner }}/exocraft-backend:latest
            ghcr.io/${{ github.repository_owner }}/exocraft-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image Frontend ──
      - name: Build & push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-projet/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/exocraft-frontend:latest
            ghcr.io/${{ github.repository_owner }}/exocraft-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Déploiement sur le serveur via SSH
  # (Nécessite les secrets : DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — Serveur production
    needs: docker
    runs-on: ubuntu-latest

    # ⚠️  Désactiver ce job si vous n'avez pas encore de serveur :
    # remplacer "if: true" par "if: false" ou supprimer ce job
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      secrets.DEPLOY_HOST != ''

    environment:
      name: production
      url: http://${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            cd /opt/exocraft

            # Connexion GHCR sur le serveur
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Mettre à jour le docker-compose.yml avec les nouvelles images
            export BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/exocraft-backend:${{ github.sha }}"
            export FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/exocraft-frontend:${{ github.sha }}"

            # Pull et redémarrage sans downtime (rolling)
            docker compose pull
            docker compose up -d --remove-orphans

            # Nettoyage des images obsolètes
            docker image prune -f

            echo "✅ Déploiement ${{ github.sha }} terminé"
